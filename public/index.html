    <script>
      (function() {
        function shouldSuppress(err) {
          if (!err) return false;
          var msg = (err.message || (err.reason && err.reason.message) || String(err.reason || '') || String(err)).toLowerCase();
          return msg.includes('suspended') || msg.includes('auth/permission-denied') || msg.includes('api-key');
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason) || (event.reason && event.reason.code === 'auth/permission-denied')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.warn("Handled unhandledrejection for Firebase key suspension");
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.error) || shouldSuppress(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.warn("Handled uncaught error for Firebase key suspension");
          }
        }, true);
      })();
    </script>
